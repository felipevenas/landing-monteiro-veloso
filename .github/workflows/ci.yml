name: Integração Contínua (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Qualidade (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Verificar Formatação
        run: npm run format:check

      - name: Executar ESLint
        run: npm run lint

      - name: Verificar Tipos e Componentes Astro
        run: npm run typecheck

      - name: Executar Testes Unitários (Vitest)
        run: npm test

      - name: Validar Build de Preview
        run: npm run build:preview

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Instalar Navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar Suíte E2E
        run: npm run test:e2e

      - name: Publicar Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
